# SPDX-License-Identifier: MIT
#
# GitHub Actions: Validate module source files
#
# Simple, reliable validation that runs on every push/PR.
# Does NOT require Zephyr SDK or west — just Python + basic tools.

name: Validate Source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-pip device-tree-compiler
          pip3 install pyyaml -q
      - name: DTS YAML
        run: |
          echo "::group::DTS YAML"
          for f in dts/bindings/*.yaml dts/bindings/*/*.yaml dts/bindings/**/*.yaml; do
            [ -f "$f" ] || continue
            python3 -c "import yaml; yaml.safe_load(open('$f')); print(f'  OK $f')"
          done
          echo "::endgroup::"
      - name: DTS includes
        run: |
          echo "::group::DTS includes"
          for f in dts/behaviors/*.dtsi; do
            [ -f "$f" ] || continue
            o=$(grep -c '{' "$f" || true)
            c=$(grep -c '}' "$f" || true)
            [ "$o" = "$c" ] && echo "  OK $f ($o braces)" || { echo "  FAIL $f ($o open / $c close)"; exit 1; }
          done
          echo "::endgroup::"
      - name: Files exist
        run: |
          echo "::group::Key files"
          for f in CMakeLists.txt Kconfig src/Kconfig include/zmk_esb/protocol.h vendor/nrf-esb/include/esb.h; do
            [ -f "$f" ] && echo "  OK $f" || { echo "  MISSING $f"; exit 1; }
          done
          echo "::endgroup::"
      - name: C syntax scan
        run: |
          echo "::group::C scan"
          for f in $(find src -name '*.c' -o -name '*.h'); do
            o=$(grep -c '{' "$f" || true)
            c=$(grep -c '}' "$f" || true)
            [ "$o" = "$c" ] && continue
            echo "  WARN: $f braces mismatch ($o/$c)"
          done
          echo "  OK"
          echo "::endgroup::"
