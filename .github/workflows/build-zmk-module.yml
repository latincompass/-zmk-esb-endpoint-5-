# SPDX-License-Identifier: MIT
#
# GitHub Actions: Build and validate ZMK module integration
#
# Tests that the zmk-esb-endpoint module compiles correctly as part of
# a ZMK firmware build. Uses the official ZMK dev Docker container
# which has west, Zephyr SDK, and ARM toolchain pre-installed.
#
# Triggers:
#   - Push to main (changes to src/ or dts/)
#   - Pull request
#   - Manual trigger (workflow_dispatch)

name: Test ZMK Module Integration

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dts/**'
      - 'include/**'
      - 'Kconfig'
      - 'CMakeLists.txt'
      - '.github/workflows/build-zmk-module.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'dts/**'
      - 'include/**'
      - 'Kconfig'
      - 'CMakeLists.txt'
  workflow_dispatch:

env:
  ZMK_REF: main

jobs:
  build-zmk:
    runs-on: ubuntu-24.04
    container:
      image: zmkfirmware/zmk-dev-arm:latest

    steps:
      - name: Checkout module source
        uses: actions/checkout@v4
        with:
          path: /workspace/module
          fetch-depth: 1

      - name: Create ZMK workspace with this module
        run: |
          cd /workspace

          # west.yml: point to this module + upstream ZMK
          cat > west.yml << 'WESTEOF'
          manifest:
            projects:
              - name: zmk
                url: https://github.com/zmkfirmware/zmk
                revision: ${{ env.ZMK_REF }}
                import: true
              - name: zmk-esb-endpoint
                url: https://github.com/${{ github.repository }}
                revision: ${{ github.sha }}
                path: modules/esb
                submodules: true
            self:
              path: config
          WESTEOF

          # Init and update west
          west init -l .
          west update

      - name: Create test keyboard shield + build
        run: |
          cd /workspace/config

          # --- Test shield definition ---
          mkdir -p boards/shields/esb-test

          # .conf
          cat > boards/shields/esb-test/esb-test.conf << 'CONFEOF'
          CONFIG_ZMK_ESB_ENDPOINT=y
          CONFIG_ZMK_ESB_BEHAVIOR_UNPAIR=y
          CONFIG_ZMK_ESB_ENDPOINT_SHELL_CMDS=y
          CONFIG_ZMK_ESB_ENDPOINT_CHANNEL_HOP=y
          CONFIG_ZMK_ESB_ENDPOINT_COOP_HOP=y
          CONFIG_ZMK_ESB_ENDPOINT_LOG_LEVEL=3
          CONFEOF

          # .overlay
          cat > boards/shields/esb-test/esb-test.overlay << 'DTSEOF'
          / {
              zmk_esb: zmk_esb_endpoint {
                  compatible = "zmk,esb-endpoint";
                  esb-channel = <78>;
                  pairing-base-address = [17 f4 07 aa];
                  pairing-prefix = <0x24>;
                  data-base-address = [b9 8a 16 22];
                  data-prefix = <0xc2>;
              };
              esb_ip: esb_input_processor {
                  compatible = "zmk,esb-input-processor";
                  #input-processor-cells = <0>;
                  status = "okay";
              };
          };
          &mkp_input_listener { input-processors = <&esb_ip>; };
          &msc_input_listener { input-processors = <&esb_ip>; };
          DTSEOF

          # Minimal keymap
          cat > boards/shields/esb-test/esb-test.keymap << 'KEYMAPEOF'
          #include <behaviors.dtsi>
          #include <dt-bindings/zmk/keys.h>
          / {
              keymap {
                  compatible = "zmk,keymap";
                  default_layer {
                      bindings = <&kp A &kp B &kp C>;
                  };
              };
          };
          KEYMAPEOF

          # Kconfig.shield
          cat > boards/shields/esb-test/Kconfig.shield << 'SHIELDEOF'
          config SHIELD_ESB_TEST
              def_bool $(shields_list_contains,esb-test)
          SHIELDEOF

          # CMakeLists.txt
          touch boards/shields/esb-test/CMakeLists.txt

          # shield.conf
          echo "CONFIG_ZMK_ESB_ENDPOINT=y" > boards/shields/esb-test/shield.conf

          # Build the test keyboard
          mkdir -p /workspace/build
          cd /workspace
          west build -b nrf52833dk_nrf52833 -d build/test-nrf52833 \
            -S esb-test \
            -- -DZMK_EXTRA_MODULES=/workspace/module

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmk-test-keyboard-nrf52833
          path: /workspace/build/test-nrf52833/zephyr/zmk.uf2
          if-no-files-found: warn
          retention-days: 7
