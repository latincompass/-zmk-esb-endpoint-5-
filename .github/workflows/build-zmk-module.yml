# SPDX-License-Identifier: MIT
#
# GitHub Actions: Build and validate ZMK module integration
#
# Tests that the zmk-esb-endpoint module builds correctly as part of
# a ZMK firmware build. Uses manual west + Zephyr SDK setup for
# maximum compatibility and reliability (no external Docker image
# dependency).
#
# Triggers:
#   - Push to main (changes to src/ or dts/)
#   - Pull request
#   - Manual trigger (workflow_dispatch)

name: Test ZMK Module Integration

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dts/**'
      - 'include/**'
      - 'Kconfig'
      - 'CMakeLists.txt'
      - '.github/workflows/build-zmk-module.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'dts/**'
      - 'include/**'
      - 'Kconfig'
      - 'CMakeLists.txt'
  workflow_dispatch:

env:
  ZMK_REF: main
  ZEPHYR_SDK_VERSION: 0.16.8

jobs:
  build-zmk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout module source
        uses: actions/checkout@v4
        with:
          path: module
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-pip python3-venv python3-dev \
            cmake ninja-build gperf ccache dfu-util \
            device-tree-compiler wget xz-utils file \
            libmagic1 libsdl2-dev

      - name: Install west
        run: pip3 install west

      - name: Initialize ZMK workspace with this module
        run: |
          mkdir -p zmk-workspace
          cd zmk-workspace

          cat > west.yml << WESTEOF
          manifest:
            projects:
              - name: zmk
                url: https://github.com/zmkfirmware/zmk
                revision: ${{ env.ZMK_REF }}
                import: true
              - name: zmk-esb-endpoint
                url: https://github.com/${{ github.repository }}
                revision: ${{ github.sha }}
                path: modules/esb
                submodules: true
            self:
              path: config
          WESTEOF

          west init -l .
          west update

      - name: Setup Zephyr SDK
        run: |
          cd /opt
          SDK_VER=${{ env.ZEPHYR_SDK_VERSION }}
          SDK_DIR="zephyr-sdk-${SDK_VER}"
          if [ ! -d "${SDK_DIR}" ]; then
            sudo wget -q \
              "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz" \
              -O sdk.tar.xz
            sudo tar xf sdk.tar.xz -C /opt/
            sudo rm sdk.tar.xz
          fi
          cd "${SDK_DIR}"
          sudo ./setup.sh -t arm-zephyr-eabi -h -c
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/${SDK_DIR}" >> $GITHUB_ENV

      - name: Create test shield and build
        run: |
          cd zmk-workspace/config

          # Create ESB test shield
          mkdir -p boards/shields/esb-test

          # Kconfig.shield
          cat > boards/shields/esb-test/Kconfig.shield << 'SHIELDEOF'
          config SHIELD_ESB_TEST
              def_bool $(shields_list_contains,esb-test)
          SHIELDEOF

          touch boards/shields/esb-test/CMakeLists.txt
          echo "CONFIG_ZMK_ESB_ENDPOINT=y" > boards/shields/esb-test/shield.conf

          # .conf
          cat > boards/shields/esb-test/esb-test.conf << 'CONFEOF'
          CONFIG_ZMK_ESB_ENDPOINT=y
          CONFIG_ZMK_ESB_BEHAVIOR_UNPAIR=y
          CONFIG_ZMK_ESB_ENDPOINT_SHELL_CMDS=y
          CONFIG_ZMK_ESB_ENDPOINT_CHANNEL_HOP=y
          CONFIG_ZMK_ESB_ENDPOINT_COOP_HOP=y
          CONFEOF

          # .overlay with ESB endpoint
          cat > boards/shields/esb-test/esb-test.overlay << 'DTSEOF'
          / {
              zmk_esb: zmk_esb_endpoint {
                  compatible = "zmk,esb-endpoint";
                  esb-channel = <78>;
                  pairing-base-address = [17 f4 07 aa];
                  pairing-prefix = <0x24>;
                  data-base-address = [b9 8a 16 22];
                  data-prefix = <0xc2>;
              };
              esb_ip: esb_input_processor {
                  compatible = "zmk,esb-input-processor";
                  #input-processor-cells = <0>;
                  status = "okay";
              };
          };
          &mkp_input_listener { input-processors = <&esb_ip>; };
          &msc_input_listener { input-processors = <&esb_ip>; };
          DTSEOF

          # Minimal keymap
          cat > boards/shields/esb-test/esb-test.keymap << 'KEYMAPEOF'
          #include <behaviors.dtsi>
          #include <dt-bindings/zmk/keys.h>
          / {
              keymap {
                  compatible = "zmk,keymap";
                  default_layer {
                      bindings = <&kp A &kp B &kp C>;
                  };
              };
          };
          KEYMAPEOF

          # Build
          cd ..
          west build -b nrf52833dk_nrf52833 -d build/test-nrf52833 \
            -S esb-test \
            -- -DZMK_EXTRA_MODULES=${{ github.workspace }}/module

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmk-test-keyboard-nrf52833
          path: zmk-workspace/build/test-nrf52833/zephyr/zmk.uf2
          if-no-files-found: warn
          retention-days: 7
