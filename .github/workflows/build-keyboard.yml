# SPDX-License-Identifier: MIT
# Build: ZMK keyboard firmware with ESB module (.hex)
# Uses west init + build with explicit modules.

name: ⌨️ Build Keyboard

on:
  workflow_dispatch:
  push: { branches: [main] }

env:
  SDK_VER: 0.16.8

jobs:
  keyboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip cmake ninja-build device-tree-compiler wget xz-utils
          pip3 install west -q

      - name: SDK
        run: |
          cd /opt
          sudo wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          sudo tar xf zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz
          sudo rm zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz
          cd zephyr-sdk-${SDK_VER} && sudo ./setup.sh -t arm-zephyr-eabi -h

      - name: Build
        run: |
          mkdir -p /opt/ws
          cd /opt/ws

          # West manifest: zephyr + zmk + hal_nordic
          cat > west.yml << 'MANIFEST'
          manifest:
            self: { path: config }
            projects:
              - name: zephyr
                url: https://github.com/zephyrproject-rtos/zephyr
                revision: v3.7.0
                west-commands: scripts/west-commands.yml
              - name: zmk
                url: https://github.com/zmkfirmware/zmk
                revision: main
                path: zmk
                west-commands: scripts/west-commands.yml
              - name: hal_nordic
                url: https://github.com/zephyrproject-rtos/hal_nordic
                revision: master
                path: modules/hal/nordic
              - name: cmsis
                url: https://github.com/zephyrproject-rtos/cmsis
                revision: master
                path: modules/hal/cmsis
          MANIFEST

          west init -l .
          west update --fetch=smart -o=--depth=1 2>&1 | tail -20

          # Copy ESB module into workspace
          mkdir -p modules/esb
          cp -r ${{ github.workspace }}/repo/* modules/esb/

          # Create config files
          cat > config/nrf52833dk_nrf52833.conf << 'CONF'
          CONFIG_ZMK_ESB_ENDPOINT=y
          CONFIG_ZMK_ESB_BEHAVIOR_UNPAIR=y
          CONF

          cat > config/nrf52833dk_nrf52833.overlay << 'OVL'
          / { zmk_esb: zmk_esb_endpoint { compatible = "zmk,esb-endpoint";
              esb-channel = <78>;
              pairing-base-address = [17 f4 07 aa];
              pairing-prefix = <0x24>;
              data-base-address = [b9 8a 16 22];
              data-prefix = <0xc2>;
          }; };
          OVL

          cat > config/nrf52833dk_nrf52833.keymap << 'KMP'
          #include <behaviors.dtsi>
          #include <dt-bindings/zmk/keys.h>
          / { keymap { compatible = "zmk,keymap";
              default_layer { bindings = <&kp A &kp B &kp C>; };
          }; };
          KMP

          # Build: use zmk's app/west.yml
          cd zmk/app
          ZMK_MODULE_DIR=/opt/ws/modules/esb
          west build -b nrf52833dk_nrf52833 -d /opt/ws/build \
            -- -DZMK_CONFIG=/opt/ws/config \
               -DZMK_EXTRA_MODULES="$ZMK_MODULE_DIR" 2>&1 | tail -30

          mkdir -p ${{ github.workspace }}/firmware
          cp /opt/ws/build/zephyr/zephyr.hex ${{ github.workspace }}/firmware/zmk-esb-keyboard-nrf52833.hex

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-keyboard-nrf52833
          path: firmware/zmk-esb-keyboard-nrf52833.hex
          if-no-files-found: error
          retention-days: 30
