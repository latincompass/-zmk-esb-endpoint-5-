# SPDX-License-Identifier: MIT
name: ⌨️ Build Keyboard
on: [workflow_dispatch, push]

jobs:
  keyboard:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
        with: { path: repo }

      - name: Build
        run: |
          set -ex
          WS=/tmp/ws
          rm -rf $WS && mkdir -p $WS && cd $WS
          cat > west.yml << 'EOF'
          manifest:
            defaults: { remote: zmkfirmware }
            remotes:
              - name: zmkfirmware
                url-base: https://github.com/zmkfirmware
              - name: zephyr
                url-base: https://github.com/zephyrproject-rtos
            projects:
              - name: zmk
                revision: main
              - name: zephyr
                remote: zephyr
                revision: v3.7.0
                west-commands: scripts/west-commands.yml
              - name: hal_nordic
                remote: zephyr
                revision: master
                path: modules/hal/nordic
            self: { path: config }
          EOF
          west init -l .
          west update --fetch=smart -o=--depth=1
          mkdir -p modules/esb-ep && cp -r ${{ github.workspace }}/repo/* modules/esb-ep/
          echo "CONFIG_ZMK_ESB_ENDPOINT=y" > config/nrf52833dk_nrf52833.conf
          cd zmk/app && rm -rf /tmp/ws/build
          west build -b nrf52833dk_nrf52833 -d /tmp/ws/build \
            -- -DZMK_CONFIG=/tmp/ws/config -DZMK_EXTRA_MODULES=/tmp/ws/modules/esb-ep
          mkdir -p ${{ github.workspace }}/firmware
          cp /tmp/ws/build/zephyr/zephyr.hex ${{ github.workspace }}/firmware.hex 2>/dev/null || true
          cp /tmp/ws/build/zephyr/zmk.uf2 ${{ github.workspace }}/firmware.uf2 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-keyboard-nrf52833
          path: ${{ github.workspace }}/firmware.*
          if-no-files-found: warn
          retention-days: 30
