# SPDX-License-Identifier: MIT
# Build: ZMK keyboard + ESB module (.hex)
# Uses ZMK v0.3.0 (the version this module was tested against).

name: ⌨️ Build Keyboard

on:
  workflow_dispatch:
  push: { branches: [main] }

env:
  SDK_VER: 0.16.8

jobs:
  keyboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: repo }

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip cmake ninja-build device-tree-compiler wget xz-utils
      - run: pip3 install west -q

      - name: SDK
        run: |
          cd /opt
          sudo wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          sudo tar xf zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz && sudo rm *.tar.xz
          cd zephyr-sdk-${SDK_VER} && sudo ./setup.sh -t arm-zephyr-eabi -h

      - name: Build
        run: |
          mkdir -p /opt/ws && cd /opt/ws

          # README says: "Only tested against ZMK v0.3.0"
          cat > west.yml << EOF
          manifest:
            self: { path: config }
            projects:
              - name: zmk
                url: https://github.com/zmkfirmware/zmk
                revision: v0.3.0
              - name: zephyr
                url: https://github.com/zephyrproject-rtos/zephyr
                revision: v3.7.0
              - name: hal_nordic
                url: https://github.com/zephyrproject-rtos/hal_nordic
                revision: master
                path: modules/hal/nordic
          EOF

          west init -l . && west update --fetch=smart -o=--depth=1

          # Put the module where ZMK can find it
          cp -r ${{ github.workspace }}/repo modules/esb-endpoint

          # Config: enable ESB endpoint
          mkdir -p config
          cat > config/nrf52833dk_nrf52833.conf << 'CONF'
          CONFIG_ZMK_ESB_ENDPOINT=y
          CONF

          cat > config/nrf52833dk_nrf52833.overlay << 'OVL'
          / {
              zmk_esb: zmk_esb_endpoint {
                  compatible = "zmk,esb-endpoint";
                  esb-channel = <78>;
                  pairing-base-address = [17 f4 07 aa];
                  pairing-prefix = <0x24>;
                  data-base-address = [b9 8a 16 22];
                  data-prefix = <0xc2>;
              };
              esb_ip: esb_input_processor {
                  compatible = "zmk,esb-input-processor";
                  #input-processor-cells = <0>;
                  status = "okay";
              };
          };
          &mkp_input_listener { input-processors = <&esb_ip>; };
          &msc_input_listener { input-processors = <&esb_ip>; };
          OVL

          # Build
          cd zmk/app
          west build -b nrf52833dk_nrf52833 -d /opt/ws/build \
            -- -DZMK_CONFIG=/opt/ws/config \
               -DZMK_EXTRA_MODULES=/opt/ws/modules/esb-endpoint
          mkdir -p ${{ github.workspace }}/firmware
          cp /opt/ws/build/zephyr/zephyr.hex ${{ github.workspace }}/firmware/zmk-esb-keyboard-nrf52833.hex

      - uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-keyboard-nrf52833
          path: firmware/zmk-esb-keyboard-nrf52833.hex
          if-no-files-found: error
          retention-days: 30
