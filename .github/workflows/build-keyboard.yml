# SPDX-License-Identifier: MIT
# Build: ZMK keyboard firmware with ESB module (.hex)
# Uses manual git clone (no west update).

name: ⌨️ Build Keyboard

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SDK_VER: 0.16.8
  ZEPHYR_VER: v3.7.0

jobs:
  keyboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-pip cmake ninja-build device-tree-compiler wget xz-utils

      - name: Download Zephyr SDK
        run: |
          cd /opt
          sudo wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          sudo tar xf zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz
          sudo rm zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz
          cd zephyr-sdk-${SDK_VER} && sudo ./setup.sh -t arm-zephyr-eabi -h

      - name: Clone Zephyr
        run: |
          mkdir -p /opt/zmk-workspace/modules/hal
          cd /opt/zmk-workspace
          git clone --depth=1 --branch ${ZEPHYR_VER} \
            https://github.com/zephyrproject-rtos/zephyr zephyr
          git clone --depth=1 \
            https://github.com/zephyrproject-rtos/hal_nordic \
            modules/hal/nordic
          git clone --depth=1 \
            https://github.com/zephyrproject-rtos/cmsis \
            modules/hal/cmsis

      - name: Clone ZMK
        run: |
          cd /opt/zmk-workspace
          git clone --depth=1 --branch main \
            https://github.com/zmkfirmware/zmk zmk

      - name: Create ZMK config with ESB module
        run: |
          mkdir -p /opt/zmk-workspace/config/boards
          cat > /opt/zmk-workspace/config/nrf52833dk_nrf52833.conf << 'CONF'
          CONFIG_ZMK_ESB_ENDPOINT=y
          CONFIG_ZMK_ESB_BEHAVIOR_UNPAIR=y
          CONFIG_ZMK_ESB_ENDPOINT_SHELL_CMDS=y
          CONFIG_ZMK_ESB_ENDPOINT_CHANNEL_HOP=y
          CONFIG_ZMK_ESB_ENDPOINT_COOP_HOP=y
          CONF

          cat > /opt/zmk-workspace/config/nrf52833dk_nrf52833.overlay << 'OVL'
          / {
              zmk_esb: zmk_esb_endpoint {
                  compatible = "zmk,esb-endpoint";
                  esb-channel = <78>;
                  pairing-base-address = [17 f4 07 aa];
                  pairing-prefix = <0x24>;
                  data-base-address = [b9 8a 16 22];
                  data-prefix = <0xc2>;
              };
              esb_ip: esb_input_processor {
                  compatible = "zmk,esb-input-processor";
                  #input-processor-cells = <0>;
                  status = "okay";
              };
          };
          &mkp_input_listener { input-processors = <&esb_ip>; };
          &msc_input_listener { input-processors = <&esb_ip>; };
          OVL

          cat > /opt/zmk-workspace/config/nrf52833dk_nrf52833.keymap << 'KMP'
          #include <behaviors.dtsi>
          #include <dt-bindings/zmk/keys.h>
          / {
              keymap { compatible = "zmk,keymap";
                  default_layer {
                      bindings = <&kp A &kp B &kp C>;
                  };
              };
          };
          KMP

      - name: Build
        run: |
          export ZEPHYR_BASE=/opt/zmk-workspace/zephyr
          export ZEPHYR_MODULES="/opt/zmk-workspace/modules/hal/nordic;/opt/zmk-workspace/modules/hal/cmsis;/opt/zmk-workspace/zmk"
          export ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-${SDK_VER}

          source "$ZEPHYR_BASE/zephyr-env.sh"

          cd /opt/zmk-workspace/config
          mkdir -p build

          # ZMK uses its own build system — point to the app dir
          cd /opt/zmk-workspace/zmk/app
          west build -b nrf52833dk_nrf52833 -d /opt/zmk-workspace/config/build \
            -- \
            -DZMK_CONFIG=/opt/zmk-workspace/config \
            -DZMK_EXTRA_MODULES=${{ github.workspace }}/module \
            -DZEPHYR_MODULES="$ZEPHYR_MODULES" \
            -DZEPHYR_BASE="$ZEPHYR_BASE"

          mkdir -p ${{ github.workspace }}/firmware
          cp /opt/zmk-workspace/config/build/zephyr/zephyr.hex \
             ${{ github.workspace }}/firmware/zmk-esb-keyboard-nrf52833.hex

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-keyboard-nrf52833
          path: firmware/zmk-esb-keyboard-nrf52833.hex
          if-no-files-found: error
          retention-days: 30
