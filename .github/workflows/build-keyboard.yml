# SPDX-License-Identifier: MIT
name: ⌨️ Build Keyboard
on: [workflow_dispatch, push]

env:
  SDK_VER: 0.16.8

jobs:
  keyboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: repo }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip cmake ninja-build device-tree-compiler wget xz-utils
      - run: pip3 install west -q

      - name: SDK
        run: |
          cd /opt
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          tar xf zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz && rm *.tar.xz
          cd zephyr-sdk-${SDK_VER} && ./setup.sh -t arm-zephyr-eabi -h

      - name: Build
        run: |
          set -ex
          WS=/tmp/ws
          rm -rf $WS
          mkdir -p $WS && cd $WS

          cat > west.yml << 'EOF'
manifest:
  defaults:
    remote: zmkfirmware
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: zephyr
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zmk
      revision: main
    - name: zephyr
      remote: zephyr
      revision: v3.7.0
      west-commands: scripts/west-commands.yml
    - name: hal_nordic
      remote: zephyr
      revision: master
      path: modules/hal/nordic
  self:
    path: config
EOF
          west init -l .
          west update --fetch=smart -o=--depth=1

          mkdir -p modules/esb-ep
          cp -r ${{ github.workspace }}/repo/* modules/esb-ep/
          echo "CONFIG_ZMK_ESB_ENDPOINT=y" > config/nrf52833dk_nrf52833.conf

          cd zmk/app
          rm -rf /tmp/ws/build
          west build -b nrf52833dk_nrf52833 -d /tmp/ws/build \
            -- -DZMK_CONFIG=/tmp/ws/config \
               -DZMK_EXTRA_MODULES=/tmp/ws/modules/esb-ep

          mkdir -p ${{ github.workspace }}/firmware
          for ext in hex uf2 bin elf; do
            f=$(find /tmp/ws/build -name "zephyr.$ext" 2>/dev/null | head -1)
            [ -n "$f" ] && cp "$f" ${{ github.workspace }}/firmware.$ext
          done

      - uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-keyboard-nrf52833
          path: ${{ github.workspace }}/firmware.*
          if-no-files-found: warn
          retention-days: 30
