# SPDX-License-Identifier: MIT
name: ⌨️ Build Keyboard
on:
  workflow_dispatch:
  push: { branches: [main] }

env:
  SDK_VER: 0.16.8

jobs:
  keyboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: repo }

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip cmake ninja-build device-tree-compiler wget xz-utils

      - name: 🛠 Install
        run: |
          pip3 install west -q
          cd /opt
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          tar xf zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz && rm *.tar.xz
          cd zephyr-sdk-${SDK_VER} && ./setup.sh -t arm-zephyr-eabi -h

      - name: 📦 Clone + Build
        shell: bash
        run: |
          set -ex

          WS=/tmp/ws
          rm -rf $WS
          mkdir -p $WS && cd $WS

          cat > west.yml << 'EOF'
          manifest:
            defaults: { remote: zmk }
            remotes:
              - name: zmk
                url-base: https://github.com/zmkfirmware
              - name: zephyr
                url-base: https://github.com/zephyrproject-rtos
            projects:
              - name: zmk
                revision: main
              - name: zephyr
                remote: zephyr
                revision: v3.7.0
                west-commands: scripts/west-commands.yml
              - name: hal_nordic
                remote: zephyr
                revision: master
                path: modules/hal/nordic
            self: { path: config }
          EOF

          west init -l .
          west update --fetch=smart -o=--depth=1

          # Copy module into workspace
          mkdir -p modules/esb-ep
          cp -r ${{ github.workspace }}/repo/* modules/esb-ep/

          # Config files
          echo "CONFIG_ZMK_ESB_ENDPOINT=y" > config/nrf52833dk_nrf52833.conf
          cat > config/nrf52833dk_nrf52833.overlay << 'OVL'
          / { zmk_esb: zmk_esb_endpoint {
              compatible = "zmk,esb-endpoint";
              esb-channel = <78>;
              pairing-base-address = [17 f4 07 aa];
              pairing-prefix = <0x24>;
              data-base-address = [b9 8a 16 22];
              data-prefix = <0xc2>;
          }; };
          OVL
          cat > config/nrf52833dk_nrf52833.keymap << 'KMP'
          #include <behaviors.dtsi>
          #include <dt-bindings/zmk/keys.h>
          / { keymap { compatible = "zmk,keymap";
              default_layer { bindings = <&kp A>; };
          }; };
          KMP

          # Clean build
          cd zmk/app
          rm -rf /tmp/ws/build
          west build -b nrf52833dk_nrf52833 -d /tmp/ws/build \
            -- -DZMK_CONFIG=/tmp/ws/config \
               -DZMK_EXTRA_MODULES=/tmp/ws/modules/esb-ep

          # List outputs
          find /tmp/ws/build/zephyr -maxdepth 1 -type f 2>/dev/null
          ls -la /tmp/ws/build/zephyr/zephyr.hex 2>/dev/null && echo "HEX_OK" || echo "HEX_MISSING"
          ls -la /tmp/ws/build/zephyr/zmk.uf2 2>/dev/null && echo "UF2_OK" || echo "UF2_MISSING"

          mkdir -p ${{ github.workspace }}/firmware
          cp /tmp/ws/build/zephyr/zephyr.hex ${{ github.workspace }}/firmware/zmk-esb-keyboard-nrf52833.hex 2>/dev/null || true
          cp /tmp/ws/build/zephyr/zmk.uf2 ${{ github.workspace }}/firmware/zmk-esb-keyboard-nrf52833.uf2 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-keyboard-nrf52833
          path: firmware/zmk-esb-keyboard-nrf52833.*
          if-no-files-found: true
          retention-days: 30
