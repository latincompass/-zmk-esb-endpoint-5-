# SPDX-License-Identifier: MIT
# Build: ZMK keyboard firmware with ESB module (.uf2)
# Uses ZMK's official build container from ghcr.io.

name: ⌨️ Build Keyboard

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  keyboard:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - name: Create ZMK config with this module
        run: |
          mkdir -p /workspace/config
          cd /workspace

          # west.yml
          cat > west.yml << 'EOF'
          manifest:
            projects:
              - name: zmk
                url: https://github.com/zmkfirmware/zmk
                revision: main
                import: true
              - name: zmk-esb-endpoint
                url: https://github.com/${{ github.repository }}
                revision: ${{ github.sha }}
                path: modules/esb
                submodules: true
            self:
              path: config
          EOF

          # Enable ESB
          cat > config/nrf52833dk_nrf52833.conf << 'CONF'
          CONFIG_ZMK_ESB_ENDPOINT=y
          CONFIG_ZMK_ESB_BEHAVIOR_UNPAIR=y
          CONFIG_ZMK_ESB_ENDPOINT_SHELL_CMDS=y
          CONFIG_ZMK_ESB_ENDPOINT_CHANNEL_HOP=y
          CONFIG_ZMK_ESB_ENDPOINT_COOP_HOP=y
          CONF

          # Overlay with ESB nodes
          mkdir -p config/boards
          cat > config/nrf52833dk_nrf52833.overlay << 'OVL'
          / {
              zmk_esb: zmk_esb_endpoint {
                  compatible = "zmk,esb-endpoint";
                  esb-channel = <78>;
                  pairing-base-address = [17 f4 07 aa];
                  pairing-prefix = <0x24>;
                  data-base-address = [b9 8a 16 22];
                  data-prefix = <0xc2>;
              };
          };
          OVL

          # Keymap
          cat > config/nrf52833dk_nrf52833.keymap << 'KMP'
          #include <behaviors.dtsi>
          #include <dt-bindings/zmk/keys.h>
          / {
              keymap { compatible = "zmk,keymap";
                  default_layer {
                      bindings = <&kp A &kp B &kp C>;
                  };
              };
          };
          KMP

      - name: Init + update
        run: |
          cd /workspace
          west init -l .
          west update --narrow -o=--depth=1

      - name: Build
        run: |
          cd /workspace
          west build -b nrf52833dk_nrf52833 -d build \
            -- -DZMK_EXTRA_MODULES=${{ github.workspace }}/module
          mkdir -p ${{ github.workspace }}/firmware
          cp build/zephyr/zmk.uf2 ${{ github.workspace }}/firmware/zmk-esb-keyboard-nrf52833.uf2 2>/dev/null || \
          cp build/zephyr/zephyr.hex ${{ github.workspace }}/firmware/zmk-esb-keyboard-nrf52833.hex

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-keyboard-nrf52833
          path: firmware/zmk-esb-keyboard-nrf52833.*
          if-no-files-found: error
          retention-days: 30
