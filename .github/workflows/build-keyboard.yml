# SPDX-License-Identifier: MIT
# Build: ZMK keyboard firmware with ESB module (.hex)

name: ⌨️ Build Keyboard

on:
  workflow_dispatch:
  push: { branches: [main] }

env:
  SDK_VER: 0.16.8

jobs:
  keyboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: repo }

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip cmake ninja-build device-tree-compiler wget xz-utils
      - run: pip3 install west -q

      - name: SDK
        run: |
          cd /opt
          sudo wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          sudo tar xf zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz && sudo rm *.tar.xz
          cd zephyr-sdk-${SDK_VER} && sudo ./setup.sh -t arm-zephyr-eabi -h

      - name: Clone ZMK + build
        run: |
          set -ex

          # Clone Zephyr and ZMK
          mkdir -p /opt/ws/modules/hal
          cd /opt/ws
          git clone --depth=1 --branch v3.7.0 https://github.com/zephyrproject-rtos/zephyr zephyr
          git clone --depth=1 --branch v0.3.0 https://github.com/zmkfirmware/zmk zmk
          git clone --depth=1 https://github.com/zephyrproject-rtos/hal_nordic modules/hal/nordic
          git clone --depth=1 https://github.com/zephyrproject-rtos/cmsis modules/hal/cmsis

          export ZEPHYR_BASE=/opt/ws/zephyr
          export ZEPHYR_MODULES="/opt/ws/modules/hal/nordic;/opt/ws/modules/hal/cmsis;/opt/ws/zmk"
          export ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-${SDK_VER}
          source "$ZEPHYR_BASE/zephyr-env.sh"

          # Config: enable ESB
          mkdir -p /opt/ws/config
          echo "CONFIG_ZMK_ESB_ENDPOINT=y" > /opt/ws/config/nrf52833dk_nrf52833.conf

          # Copy module
          cp -r ${{ github.workspace }}/repo /opt/ws/modules/esb-ep

          # Build from ZMK app dir
          cd /opt/ws/zmk/app
          west build -b nrf52833dk_nrf52833 -d /opt/ws/build \
            -- -DZMK_CONFIG=/opt/ws/config \
               -DZMK_EXTRA_MODULES=/opt/ws/modules/esb-ep

          echo "=== Build output ==="
          ls -la /opt/ws/build/zephyr/zephyr.hex 2>/dev/null && echo "HEX FOUND" || echo "NO HEX"

      - name: Upload firmware
        run: |
          if [ -f /opt/ws/build/zephyr/zephyr.hex ]; then
            mkdir -p ${{ github.workspace }}/firmware
            cp /opt/ws/build/zephyr/zephyr.hex ${{ github.workspace }}/firmware/zmk-esb-keyboard-nrf52833.hex
            echo "firmware file size:"
            ls -lh ${{ github.workspace }}/firmware/zmk-esb-keyboard-nrf52833.hex
          elif [ -f /opt/ws/build/zephyr/zmk.uf2 ]; then
            mkdir -p ${{ github.workspace }}/firmware
            cp /opt/ws/build/zephyr/zmk.uf2 ${{ github.workspace }}/firmware/zmk-esb-keyboard-nrf52833.hex
          else
            echo "ERROR: No firmware file produced!"
            find /opt/ws/build -name "*.hex" -o -name "*.uf2" -o -name "*.elf" 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-keyboard-nrf52833
          path: firmware/zmk-esb-keyboard-nrf52833.hex
          if-no-files-found: error
          retention-days: 30
