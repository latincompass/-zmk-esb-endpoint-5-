name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-dongle:
    runs-on: ubuntu-22.04
    name: Build ESB Dongle
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python 3.12
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-dev python3.12-venv

      - name: Install pip for Python 3.12
        run: |
          wget -q https://bootstrap.pypa.io/get-pip.py
          python3.12 get-pip.py

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler \
            wget \
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev

      - name: Install Python packages
        run: |
          python3.12 -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple west pyelftools cmake

      - name: Install Zephyr SDK 1.0
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.0/zephyr-sdk-1.0.0_linux-x86_64.tar.xz
          tar xvf zephyr-sdk-1.0.0_linux-x86_64.tar.xz
          sudo cp -rf zephyr-sdk-1.0.0 /opt/
          ls -la /opt/zephyr-sdk-1.0.0

      - name: Build dongle firmware
        working-directory: dongle
        run: |
          export PATH=~/.local/bin:$PATH
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          export ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-1.0.0
          export CMAKE_PREFIX_PATH=/opt/zephyr-sdk-1.0.0/cmake
          echo "SDK path: $ZEPHYR_SDK_INSTALL_DIR"
          ls -la $ZEPHYR_SDK_INSTALL_DIR/cmake/
          python3.12 -m west init -l .
          python3.12 -m west update --narrow -o=--depth=1
          python3.12 -m west build -b nrf52833dk/nrf52833 -p auto .

      - name: Check built files
        run: ls -la dongle/build/zephyr/

      - name: Upload dongle hex
        uses: actions/upload-artifact@v4
        with:
          name: dongle-nrf52833dk
          path: |
            dongle/build/zephyr/zephyr.hex
            dongle/build/zephyr/zephyr.bin

  build-keyboard:
    runs-on: ubuntu-22.04
    name: Build Keyboard
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: zmk-esb-endpoint

      - name: Install Python 3.12
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-dev python3.12-venv

      - name: Install pip for Python 3.12
        run: |
          wget -q https://bootstrap.pypa.io/get-pip.py
          python3.12 get-pip.py

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler \
            wget \
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev

      - name: Install Python packages
        run: |
          python3.12 -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple west pyelftools cmake

      - name: Install Zephyr SDK 1.0
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.0/zephyr-sdk-1.0.0_linux-x86_64.tar.xz
          tar xvf zephyr-sdk-1.0.0_linux-x86_64.tar.xz
          sudo cp -rf zephyr-sdk-1.0.0 /opt/
          ls -la /opt/zephyr-sdk-1.0.0

      - name: Setup ZMK workspace
        run: |
          mkdir -p zmk-config/config
          cp -r zmk-esb-endpoint/examples/hhkb/* zmk-config/config/
          
          cat > zmk-config/west.yml << 'EOF'
          manifest:
            remotes:
              - name: zmkfirmware
                url-base: https://github.com/zmkfirmware
              - name: esb-local
                url-base: ../zmk-esb-endpoint
            projects:
              - name: zmk
                remote: zmkfirmware
                revision: main
                import: app/west.yml
              - name: zmk-esb-endpoint
                remote: esb-local
                revision: main
                path: modules/zmk-esb-endpoint
            self:
              path: config
          EOF

      - name: Build keyboard firmware
        working-directory: zmk-config
        run: |
          export PATH=~/.local/bin:$PATH
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          export ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-1.0.0
          export CMAKE_PREFIX_PATH=/opt/zephyr-sdk-1.0.0/cmake
          echo "SDK path: $ZEPHYR_SDK_INSTALL_DIR"
          ls -la $ZEPHYR_SDK_INSTALL_DIR/cmake/
          python3.12 -m west init -l .
          python3.12 -m west update --narrow -o=--depth=1
          python3.12 -m west build -b nrf52833dk/nrf52833 -p auto zmk/app -- -DZMK_CONFIG=${PWD}/config

      - name: Check built files
        run: ls -la zmk-config/build/zephyr/

      - name: Upload keyboard hex
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-hhkb-nrf52833dk
          path: |
            zmk-config/build/zephyr/zephyr.hex
            zmk-config/build/zephyr/zephyr.bin