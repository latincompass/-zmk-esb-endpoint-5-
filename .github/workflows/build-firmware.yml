name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-dongle:
    runs-on: ubuntu-24.04
    name: Build ESB Dongle
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-sdk@v12
        with:
          sdk-version: '0.16.4'

      - name: Build dongle firmware
        working-directory: dongle
        run: |
          west init -l .
          west update --narrow -o=--depth=1
          west build -b nrf52833dk_nrf52833 -p auto .

      - name: Check built files
        run: ls -la dongle/build/zephyr/

      - name: Upload dongle hex
        uses: actions/upload-artifact@v4
        with:
          name: dongle-nrf52833dk
          path: |
            dongle/build/zephyr/zephyr.hex
            dongle/build/zephyr/zephyr.bin

  build-keyboard:
    runs-on: ubuntu-24.04
    name: Build Keyboard
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: zmk-esb-endpoint

      - name: Install Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-sdk@v12
        with:
          sdk-version: '0.16.4'

      - name: Setup ZMK workspace
        run: |
          mkdir -p zmk-config/config
          cp -r zmk-esb-endpoint/examples/hhkb/* zmk-config/config/
          
          cat > zmk-config/west.yml << 'EOF'
          manifest:
            remotes:
              - name: zmkfirmware
                url-base: https://github.com/zmkfirmware
              - name: esb-local
                url-base: ../zmk-esb-endpoint
            projects:
              - name: zmk
                remote: zmkfirmware
                revision: main
                import: app/west.yml
              - name: zmk-esb-endpoint
                remote: esb-local
                revision: main
                path: modules/zmk-esb-endpoint
            self:
              path: config
          EOF

      - name: Build keyboard firmware
        working-directory: zmk-config
        run: |
          west init -l .
          west update --narrow -o=--depth=1
          west build -b nrf52833dk_nrf52833 -p auto zmk/app -- -DZMK_CONFIG=${PWD}/config

      - name: Check built files
        run: ls -la zmk-config/build/zephyr/

      - name: Upload keyboard hex
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-hhkb-nrf52833dk
          path: |
            zmk-config/build/zephyr/zephyr.hex
            zmk-config/build/zephyr/zephyr.bin