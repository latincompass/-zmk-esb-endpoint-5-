# SPDX-License-Identifier: MIT
# GitHub Actions: Build ESB dongle and keyboard firmware

name: Build Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-dongle:
    runs-on: ubuntu-24.04
    name: Build ESB Dongle (nRF52833)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Install Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-sdk@v12
        with:
          sdk-version: '0.16.4'
          cmake-version: '3.26.4'
          ninja-version: '1.11.1'
          
      - name: Initialize Zephyr workspace for dongle
        working-directory: dongle
        run: |
          west init -l .
          west update
          west zephyr-export
      
      - name: Build dongle firmware
        working-directory: dongle
        run: |
          west build -b nrf52833dk_nrf52833 -p auto .
      
      - name: Upload dongle firmware
        uses: actions/upload-artifact@v4
        with:
          name: dongle-firmware
          path: dongle/build/zephyr/zephyr.hex

  build-keyboard:
    runs-on: ubuntu-24.04
    name: Build Keyboard Firmware (HHKB nRF52833)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          path: zmk-esb-endpoint
      
      - name: Install Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-sdk@v12
        with:
          sdk-version: '0.16.4'
          cmake-version: '3.26.4'
          ninja-version: '1.11.1'
          
      - name: Create ZMK config project
        run: |
          mkdir -p zmk-config/config
          cp -r zmk-esb-endpoint/examples/hhkb/* zmk-config/config/
          
          cat > zmk-config/west.yml << 'EOF'
          manifest:
            remotes:
              - name: zmkfirmware
                url-base: https://github.com/zmkfirmware
              - name: local-esb
                url-base: ../zmk-esb-endpoint
            projects:
              - name: zmk
                remote: zmkfirmware
                revision: main
                import: app/west.yml
              - name: zmk-esb-endpoint
                remote: local-esb
                revision: main
                path: modules/zmk-esb-endpoint
            self:
              path: config
          EOF
      
      - name: Initialize ZMK workspace
        working-directory: zmk-config
        run: |
          west init -l .
          west update --narrow -o=--depth=1
          west zephyr-export
      
      - name: Build keyboard firmware
        working-directory: zmk-config
        run: |
          west build -b nrf52833dk_nrf52833 -p auto zmk/app -- -DZMK_CONFIG=${PWD}/config
      
      - name: Upload keyboard firmware
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-firmware
          path: zmk-config/build/zephyr/zephyr.hex