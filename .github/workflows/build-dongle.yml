# SPDX-License-Identifier: MIT
# Build: nRF52833 ESB Dongle (.hex)
# Minimal west manifest, only 3 projects.

name: 🔌 Build Dongle

on:
  workflow_dispatch:
  push: { branches: [main] }

env:
  SDK_VER: 0.16.8

jobs:
  dongle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: repo }

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip cmake ninja-build device-tree-compiler wget xz-utils
      - run: pip3 install west -q

      - name: SDK
        run: |
          cd /opt
          sudo wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          sudo tar xf zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz && sudo rm *.tar.xz
          cd zephyr-sdk-${SDK_VER} && sudo ./setup.sh -t arm-zephyr-eabi -h

      - name: Build
        run: |
          mkdir -p /opt/ws && cd /opt/ws
          cat > west.yml << EOF
          manifest:
            self: { path: app }
            projects:
              - name: zephyr
                url: https://github.com/zephyrproject-rtos/zephyr
                revision: v3.7.0
              - name: hal_nordic
                url: https://github.com/zephyrproject-rtos/hal_nordic
                revision: master
                path: modules/hal/nordic
          EOF
          west init -l . && west update --fetch=smart -o=--depth=1
          rm -rf app && ln -s ${{ github.workspace }}/repo/dongle app
          west build -b nrf52833dk_nrf52833 -s app
          mkdir -p ${{ github.workspace }}/firmware
          cp build/zephyr/zephyr.hex ${{ github.workspace }}/firmware/zmk-esb-dongle-nrf52833.hex

      - uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-dongle-nrf52833
          path: firmware/zmk-esb-dongle-nrf52833.hex
          if-no-files-found: error
          retention-days: 30
