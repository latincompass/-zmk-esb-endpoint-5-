# SPDX-License-Identifier: MIT
# Build: nRF52833 ESB Dongle Firmware (.hex)
# Uses manual git clone of Zephyr + modules (no west update).

name: 🔌 Build Dongle

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SDK_VER: 0.16.8
  ZEPHYR_VER: v3.7.0

jobs:
  dongle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-pip cmake ninja-build device-tree-compiler wget xz-utils

      - name: Download Zephyr SDK
        run: |
          cd /opt
          sudo wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          sudo tar xf zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz
          sudo rm zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz
          cd zephyr-sdk-${SDK_VER} && sudo ./setup.sh -t arm-zephyr-eabi -h

      - name: Clone Zephyr + modules
        run: |
          mkdir -p /opt/zephyr-workspace/modules/hal
          cd /opt/zephyr-workspace

          # Core Zephyr
          git clone --depth=1 --branch ${ZEPHYR_VER} \
            https://github.com/zephyrproject-rtos/zephyr zephyr

          # HAL for nRF
          git clone --depth=1 \
            https://github.com/zephyrproject-rtos/hal_nordic \
            modules/hal/nordic

          # CMSIS
          git clone --depth=1 \
            https://github.com/zephyrproject-rtos/cmsis \
            modules/hal/cmsis

          # Zephyr's modules/fs (needed by some build targets)
          git clone --depth=1 \
            https://github.com/zephyrproject-rtos/fatfs \
            modules/fs/fatfs 2>/dev/null || true

      - name: Build
        run: |
          export ZEPHYR_BASE=/opt/zephyr-workspace/zephyr
          export ZEPHYR_MODULES="/opt/zephyr-workspace/modules/hal/nordic;/opt/zephyr-workspace/modules/hal/cmsis"
          export ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-${SDK_VER}

          source "$ZEPHYR_BASE/zephyr-env.sh"

          cd ${{ github.workspace }}/repo/dongle
          cmake -B build -G Ninja \
            -DBOARD=nrf52833dk_nrf52833 \
            -DZEPHYR_MODULES="$ZEPHYR_MODULES" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          ninja -C build

          mkdir -p ${{ github.workspace }}/firmware
          cp build/zephyr/zephyr.hex ${{ github.workspace }}/firmware/zmk-esb-dongle-nrf52833.hex
          echo "Firmware size:"
          ls -lh build/zephyr/zephyr.hex

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-dongle-nrf52833
          path: firmware/zmk-esb-dongle-nrf52833.hex
          if-no-files-found: error
          retention-days: 30
