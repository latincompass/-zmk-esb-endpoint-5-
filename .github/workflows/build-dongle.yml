# SPDX-License-Identifier: MIT
name: 🔌 Build Dongle
on:
  workflow_dispatch:
  push: { branches: [main] }

env:
  SDK_VER: 0.16.8

jobs:
  dongle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: repo }

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip cmake ninja-build device-tree-compiler wget xz-utils

      - name: 🛠 Install west + SDK
        run: |
          pip3 install west -q
          cd /opt
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          tar xf zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz && rm *.tar.xz
          cd zephyr-sdk-${SDK_VER} && ./setup.sh -t arm-zephyr-eabi -h

      - name: 📦 Clone + Build Dongle
        shell: bash
        run: |
          set -ex

          # Create a proper west workspace
          WS=/tmp/ws
          mkdir -p $WS
          cd $WS

          # west manifest: 3 projects only
          cat > west.yml << 'EOF'
          manifest:
            defaults:
              remote: zephyr
            remotes:
              - name: zephyr
                url-base: https://github.com/zephyrproject-rtos
            projects:
              - name: zephyr
                revision: v3.7.0
                west-commands: scripts/west-commands.yml
              - name: hal_nordic
                revision: master
                path: modules/hal/nordic
            self:
              path: app
          EOF

          # Init workspace
          west init -l $WS
          west update --fetch=smart -o=--depth=1

          # Replace empty app/ with our dongle code
          rm -rf $WS/app
          cp -r ${{ github.workspace }}/repo/dongle $WS/app

          # Build!
          cd $WS/app
          west build -b nrf52833dk_nrf52833

          # Verify output
          echo "=== BUILD OUTPUT ==="
          ls -la build/zephyr/zephyr.hex

          # Copy to upload location
          mkdir -p ${{ github.workspace }}/firmware
          cp build/zephyr/zephyr.hex ${{ github.workspace }}/firmware/zmk-esb-dongle-nrf52833.hex

      - uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-dongle-nrf52833
          path: firmware/zmk-esb-dongle-nrf52833.hex
          if-no-files-found: error
          retention-days: 30
