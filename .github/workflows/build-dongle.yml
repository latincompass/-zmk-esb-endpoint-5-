# SPDX-License-Identifier: MIT
name: 🔌 Build Dongle
on: [workflow_dispatch, push]

jobs:
  dongle:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:latest
    steps:
      - uses: actions/checkout@v4
        with: { path: repo }

      - name: Build
        run: |
          set -ex
          WS=/tmp/ws
          rm -rf $WS && mkdir -p $WS && cd $WS
          cat > west.yml << 'EOF'
          manifest:
            defaults: { remote: zephyr }
            remotes:
              - name: zephyr
                url-base: https://github.com/zephyrproject-rtos
            projects:
              - name: zephyr
                revision: v3.7.0
                west-commands: scripts/west-commands.yml
              - name: hal_nordic
                revision: master
                path: modules/hal/nordic
            self: { path: app }
          EOF
          west init -l .
          west update --fetch=smart -o=--depth=1
          rm -rf app && cp -r ${{ github.workspace }}/repo/dongle app
          cd app && rm -rf build
          west build -b nrf52833dk_nrf52833
          ls -la build/zephyr/zephyr.hex
          mkdir -p ${{ github.workspace }}/firmware
          cp build/zephyr/zephyr.hex ${{ github.workspace }}/firmware.hex

      - uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-dongle-nrf52833
          path: ${{ github.workspace }}/firmware.hex
          if-no-files-found: warn
          retention-days: 30
