# SPDX-License-Identifier: MIT
#
# GitHub Actions: Build nRF52833 ESB Dongle Firmware
#
# Builds the dongle firmware for nRF52833 using west + Zephyr SDK.

name: Build Dongle (nRF52833 PRX)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dongle/**'
      - 'vendor/nrf-esb/**'

env:
  ZEPHYR_SDK_VERSION: 0.16.8

jobs:
  build-dongle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-pip cmake ninja-build gperf ccache \
            device-tree-compiler wget xz-utils file

      - name: Install west
        run: pip3 install west

      - name: West init + update
        run: |
          mkdir workspace && cd workspace
          cp ${{ github.workspace }}/repo/dongle/west.yml .
          west init -l .
          west update -o=--depth=1

      - name: Install Zephyr SDK
        run: |
          cd /opt
          SDK_VER=${{ env.ZEPHYR_SDK_VERSION }}
          sudo wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          sudo tar xf zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz
          sudo rm zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz
          cd zephyr-sdk-${SDK_VER}
          sudo ./setup.sh -t arm-zephyr-eabi -h
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-${SDK_VER}" >> $GITHUB_ENV

      - name: Build
        run: |
          cd ${{ github.workspace }}/workspace
          rm -rf app
          ln -s ${{ github.workspace }}/repo/dongle app
          west build -b nrf52833dk_nrf52833 -s app

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zmk-esb-dongle-nrf52833
          path: ${{ github.workspace }}/workspace/build/zephyr/zephyr.hex
          if-no-files-found: error
          retention-days: 30
