#
# Example: nRF52833 HHKB keyboard with ESB endpoint
# Enable the ESB endpoint module
CONFIG_ZMK_ESB_ENDPOINT=y

# BLE is still needed for non-ESB profiles
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_PROFILE_COUNT=5

# Enable ESB behaviors
CONFIG_ZMK_ESB_BEHAVIOR_UNPAIR=y

# Enable ESB shell commands for debugging
CONFIG_ZMK_ESB_ENDPOINT_SHELL_CMDS=y

# Channel hopping (recommended for interference resilience)
CONFIG_ZMK_ESB_ENDPOINT_CHANNEL_HOP=y
CONFIG_ZMK_ESB_ENDPOINT_COOP_HOP=y

# Enable NKRO for HHKB (6KRO is the default, NKRO for full matrix)
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Log level (WRN=2, INF=3, DBG=4)
CONFIG_ZMK_ESB_ENDPOINT_LOG_LEVEL=3

# nRF52833 specific settings
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n

# Reduce stack if needed for tight flash
# CONFIG_ZMK_ESB_ENDPOINT_CTRL_STACK_SIZE=1536
