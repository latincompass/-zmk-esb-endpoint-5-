# nRF52833 ESB Dongle (PRX) Configuration
CONFIG_ZMK_ESB_DONGLE=y

# Hardware
CONFIG_BOARD=nrf52833dk_nrf52833
CONFIG_SOC_NRF52833=y

# ESB configuration (mirrors the keyboard endpoint)
CONFIG_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=32
CONFIG_ESB_TX_FIFO_SIZE=32
CONFIG_ESB_RX_FIFO_SIZE=32
CONFIG_ESB_PIPE_COUNT=2
CONFIG_ESB_NEVER_DISABLE_TX=y
CONFIG_ESB_RADIO_IRQ_PRIORITY=1
CONFIG_ESB_EVENT_IRQ_PRIORITY=2
CONFIG_ESB_DYNAMIC_INTERRUPTS=y

# USB HID
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_HID_PROTOCOL_CODE=1
CONFIG_USB_HID_BOOT_PROTOCOL=y

# Console and logging
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Required for nRF52
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_NRFX_PPI=y
CONFIG_NRFX_TIMER2=y
CONFIG_NRFX_TIMER3=n
CONFIG_NRFX_TIMER4=n
CONFIG_NRFX_RNG=n
CONFIG_NRFX_NFCT=n

# Clock
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n

# Power saving
CONFIG_PM=y
CONFIG_PM_DEVICE=y
